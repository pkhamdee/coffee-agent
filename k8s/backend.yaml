apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: coffee-agent
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: coffee-agent
spec:
  # Keep at 1: model settings saved from the /setup page live in this pod's memory.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: docker.io/pkhamdee/coffee-agent-backend:1.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: coffee-agent-config
          env:
            # Optional: leave it out of the Secret and enter the token on the /setup page.
            - name: MODEL_TOKEN
              valueFrom:
                secretKeyRef:
                  { name: coffee-agent-secret, key: MODEL_TOKEN, optional: true }
            # Optional: key for the Weather MCP server; can also be set on the /setup page.
            - name: MCP_WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  { name: coffee-agent-secret, key: MCP_WEATHER_API_KEY, optional: true }
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef: { name: coffee-agent-secret, key: MONGO_USERNAME }
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef: { name: coffee-agent-secret, key: MONGO_PASSWORD }
            - name: MONGO_URI
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@mongodb:27017/?authSource=admin
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
