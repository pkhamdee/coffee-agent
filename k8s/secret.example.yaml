# Copy to secret.yaml (git-ignored) and fill in real values:
#   cp k8s/secret.example.yaml k8s/secret.yaml
# Keep the Mongo password URL-safe (letters/digits) — it is embedded in MONGO_URI.
apiVersion: v1
kind: Secret
metadata:
  name: coffee-agent-secret
  namespace: coffee-agent
type: Opaque
stringData:
  # MODEL_TOKEN is optional — omit it and enter the token on the /setup page instead
  # (note: /setup values are kept in memory and reset when the backend pod restarts).
  # MODEL_TOKEN: sk-or-v1-REPLACE_ME
  # API key the Weather MCP server requires (generate one: openssl rand -hex 24).
  # Used by the weather-mcp pod (to check) and the backend (to send). If the MCP server
  # runs elsewhere, set it there and enter it on /setup or here for the backend.
  MCP_WEATHER_API_KEY: REPLACE_ME
  MONGO_USERNAME: admin
  MONGO_PASSWORD: REPLACE_ME
